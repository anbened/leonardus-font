name: Dependabot inventory
on:
  workflow_run:
    workflows: [Leonardus checks]
    types: [completed]
permissions: {}
jobs:
  refresh:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      actions: write
    steps:
      # Always run trusted default-branch code, never the PR's scripts or dependencies.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Refresh dependency inventory and dispatch checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python examples/dependabot_inventory.py
