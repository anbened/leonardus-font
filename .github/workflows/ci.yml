name: Leonardus checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Scan committed history for credentials
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts='--all --full-history' --redact=100 --ignore-gitleaks-allow --no-banner
      - name: Validate sources, privacy and font
        env:
          SOURCE_DATE_EPOCH: '0'
        run: |
          python -m pytest -q
          python -m leonardus.cli validate-evidence
          python examples/corpus_review.py --check-only
          python examples/corpus_review.py --batch data/lowercase_search_2026-10-14.json --check-only
          python examples/guided_review.py --check-only
          python examples/segmentation_review.py --check-only
          python examples/check_privacy.py
          python examples/inventory.py --check
          python -m leonardus.cli build-release --out build/Leonardus-Regular.ttf
          cmp build/Leonardus-Regular.ttf fonts/Leonardus-Regular.ttf
          python -m leonardus.cli build-release --version 1.000 --out build/Leonardus-Regular-1.000.ttf
          cmp build/Leonardus-Regular-1.000.ttf fonts/previous/Leonardus-Regular-1.000.ttf
          python -m leonardus.cli audit --font build/Leonardus-Regular.ttf
          python -m leonardus.cli charset --font build/Leonardus-Regular.ttf
          python examples/regular_spacing_check.py --font build/Leonardus-Regular.ttf --out build/spacing.json
          python examples/regular_specimen.py --font build/Leonardus-Regular.ttf --out build/proof --release
          python examples/regular_pdf_specimen.py --font build/Leonardus-Regular.ttf --out build/Leonardus-Specimen.pdf
          cmp build/Leonardus-Specimen.pdf specimen/Leonardus-Specimen.pdf
          python examples/segmentation_consolidation.py
          python -m leonardus.cli build-release --version 1.200 --out build/Leonardus-1200-Regular.ttf
          cmp build/Leonardus-1200-Regular.ttf fonts/Leonardus-1200-Regular.ttf
          python -m leonardus.cli audit --font build/Leonardus-1200-Regular.ttf
          python -m leonardus.cli charset --font build/Leonardus-1200-Regular.ttf
          python examples/regular_spacing_check.py --font build/Leonardus-1200-Regular.ttf --out build/spacing-1200.json
          python examples/regular_specimen.py --font build/Leonardus-1200-Regular.ttf --out build/proof-1200 --candidate
          python examples/regular_pdf_specimen.py --font build/Leonardus-1200-Regular.ttf --out build/Leonardus-1200-Specimen.pdf
          cmp build/Leonardus-1200-Specimen.pdf specimen/Leonardus-1200-Specimen.pdf
          python examples/opqr_study.py --out build/opqr-study
          python -m leonardus.cli audit --font build/opqr-study/Leonardus-OPQR-A.ttf
          python -m leonardus.cli audit --font build/opqr-study/Leonardus-OPQR-B.ttf
          python -m leonardus.cli charset --font build/opqr-study/Leonardus-OPQR-A.ttf
          python -m leonardus.cli charset --font build/opqr-study/Leonardus-OPQR-B.ttf
          python examples/regular_spacing_check.py --font build/opqr-study/Leonardus-OPQR-A.ttf --out build/opqr-study/spacing-A.json
          python examples/regular_spacing_check.py --font build/opqr-study/Leonardus-OPQR-B.ttf --out build/opqr-study/spacing-B.json
          python -m leonardus.cli build-release --version 1.210 --out build/Leonardus-1210-Regular.ttf
          cmp build/Leonardus-1210-Regular.ttf fonts/Leonardus-1210-Regular.ttf
          python -m leonardus.cli audit --font build/Leonardus-1210-Regular.ttf
          python -m leonardus.cli charset --font build/Leonardus-1210-Regular.ttf
          python examples/regular_spacing_check.py --font build/Leonardus-1210-Regular.ttf --out build/spacing-1210.json
          python examples/regular_specimen.py --font build/Leonardus-1210-Regular.ttf --out build/proof-1210 --candidate
          python examples/opqr_selection_proof.py --out build/opqr-selection.png
          python -m leonardus.cli build-release --version 1.211 --out build/Leonardus-1211-Regular.ttf
          cmp build/Leonardus-1211-Regular.ttf fonts/Leonardus-1211-Regular.ttf
          python -m leonardus.cli audit --font build/Leonardus-1211-Regular.ttf
          python -m leonardus.cli charset --font build/Leonardus-1211-Regular.ttf
          python examples/regular_spacing_check.py --font build/Leonardus-1211-Regular.ttf --ppem 16 --out build/spacing-1211-16.json
          python examples/regular_spacing_check.py --font build/Leonardus-1211-Regular.ttf --ppem 24 --out build/spacing-1211-24.json
          python examples/regular_spacing_check.py --font build/Leonardus-1211-Regular.ttf --ppem 48 --out build/spacing-1211-48.json
          python examples/regular_spacing_check.py --font build/Leonardus-1211-Regular.ttf --ppem 96 --out build/spacing-1211-96.json
          python examples/regular_spacing_check.py --font build/Leonardus-1211-Regular.ttf --ppem 128 --out build/spacing-1211-128.json
          python examples/regular_specimen.py --font build/Leonardus-1211-Regular.ttf --out build/proof-1211 --candidate
          python examples/pq_spacing_proof.py --out build/pq-spacing-proof
          python examples/aemnu_study.py --out build/aemnu-study
          for variant in A B; do
            python -m leonardus.cli audit --font "build/aemnu-study/Leonardus-AEMNU-$variant.ttf"
            python -m leonardus.cli charset --font "build/aemnu-study/Leonardus-AEMNU-$variant.ttf"
            for ppem in 16 24 48 96 128; do
              python examples/regular_spacing_check.py --font "build/aemnu-study/Leonardus-AEMNU-$variant.ttf" --ppem "$ppem" --out "build/aemnu-study/pairs-$variant-$ppem.json"
            done
          done
          python -m leonardus.cli build-release --version 1.220 --out build/Leonardus-1220-Regular.ttf
          cmp build/Leonardus-1220-Regular.ttf fonts/Leonardus-1220-Regular.ttf
          python -m leonardus.cli audit --font build/Leonardus-1220-Regular.ttf
          python -m leonardus.cli charset --font build/Leonardus-1220-Regular.ttf
          for ppem in 16 24 48 96 128; do
            python examples/regular_spacing_check.py --font build/Leonardus-1220-Regular.ttf --ppem "$ppem" --out "build/pairs-1220-$ppem.json"
          done
          python examples/regular_specimen.py --font build/Leonardus-1220-Regular.ttf --out build/proof-1220 --candidate
          python examples/aemnu_selection_proof.py --out build/aemnu-selection.png
          python examples/jkvwxy_study.py --out build/jkvwxy-study
          for variant in A B; do
            python -m leonardus.cli audit --font "build/jkvwxy-study/Leonardus-JKVWXY-$variant.ttf"
            python -m leonardus.cli charset --font "build/jkvwxy-study/Leonardus-JKVWXY-$variant.ttf"
            for ppem in 16 24 48 96 128; do
              python examples/regular_spacing_check.py --font "build/jkvwxy-study/Leonardus-JKVWXY-$variant.ttf" --ppem "$ppem" --out "build/jkvwxy-study/pairs-$variant-$ppem.json"
            done
          done
          python -m leonardus.cli build-release --version 1.230 --out build/Leonardus-1230-Regular.ttf
          cmp build/Leonardus-1230-Regular.ttf fonts/Leonardus-1230-Regular.ttf
          python -m leonardus.cli audit --font build/Leonardus-1230-Regular.ttf
          python -m leonardus.cli charset --font build/Leonardus-1230-Regular.ttf
          for ppem in 16 24 48 96 128; do
            python examples/regular_spacing_check.py --font build/Leonardus-1230-Regular.ttf --ppem "$ppem" --out "build/pairs-1230-$ppem.json"
          done
          python examples/regular_specimen.py --font build/Leonardus-1230-Regular.ttf --out build/proof-1230 --candidate
          python examples/jkvwxy_selection_proof.py --out build/jkvwxy-selection.png
          python examples/capitals_study.py --out build/capitals-study
          for variant in A B; do
            python -m leonardus.cli audit --font "build/capitals-study/Leonardus-Capitals-$variant.ttf"
            python -m leonardus.cli charset --font "build/capitals-study/Leonardus-Capitals-$variant.ttf"
            for ppem in 16 24 48 96 128; do
              python examples/regular_spacing_check.py --font "build/capitals-study/Leonardus-Capitals-$variant.ttf" --ppem "$ppem" --out "build/capitals-study/pairs-$variant-$ppem.json"
            done
          done
          python -m leonardus.cli build-release --version 1.240 --out build/Leonardus-1240-Regular.ttf
          cmp build/Leonardus-1240-Regular.ttf fonts/Leonardus-1240-Regular.ttf
          python -m leonardus.cli audit --font build/Leonardus-1240-Regular.ttf
          python -m leonardus.cli charset --font build/Leonardus-1240-Regular.ttf
          for ppem in 16 24 48 96 128; do
            python examples/regular_spacing_check.py --font build/Leonardus-1240-Regular.ttf --ppem "$ppem" --out "build/pairs-1240-$ppem.json"
          done
          python examples/regular_specimen.py --font build/Leonardus-1240-Regular.ttf --out build/proof-1240 --candidate
          python examples/capitals_selection_proof.py --out build/capitals-selection.png
          python examples/cdegpt_study.py --out build/cdegpt-study
          for variant in A B; do
            python -m leonardus.cli audit --font "build/cdegpt-study/Leonardus-CDEGPT-$variant.ttf"
            python -m leonardus.cli charset --font "build/cdegpt-study/Leonardus-CDEGPT-$variant.ttf"
            for ppem in 16 24 48 96 128; do
              python examples/regular_spacing_check.py --font "build/cdegpt-study/Leonardus-CDEGPT-$variant.ttf" --ppem "$ppem" --out "build/cdegpt-study/pairs-$variant-$ppem.json"
            done
          done
          python -m leonardus.cli build-release --version 1.250 --out build/Leonardus-1250-Regular.ttf
          cmp build/Leonardus-1250-Regular.ttf fonts/Leonardus-1250-Regular.ttf
          python -m leonardus.cli audit --font build/Leonardus-1250-Regular.ttf
          python -m leonardus.cli charset --font build/Leonardus-1250-Regular.ttf
          for ppem in 16 24 48 96 128; do
            python examples/regular_spacing_check.py --font build/Leonardus-1250-Regular.ttf --ppem "$ppem" --out "build/pairs-1250-$ppem.json"
          done
          python examples/regular_specimen.py --font build/Leonardus-1250-Regular.ttf --out build/proof-1250 --candidate
          python examples/cdegpt_selection_proof.py --out build/cdegpt-selection.png
          python examples/bfhioq_study.py --out build/bfhioq-study
          for variant in A B; do
            python -m leonardus.cli audit --font "build/bfhioq-study/Leonardus-BFHIOQ-$variant.ttf"
            python -m leonardus.cli charset --font "build/bfhioq-study/Leonardus-BFHIOQ-$variant.ttf"
            for ppem in 16 24 48 96 128; do
              python examples/regular_spacing_check.py --font "build/bfhioq-study/Leonardus-BFHIOQ-$variant.ttf" --ppem "$ppem" --out "build/bfhioq-study/pairs-$variant-$ppem.json"
            done
          done
          python -m leonardus.cli build-release --version 1.260 --out build/Leonardus-1260-Regular.ttf
          cmp build/Leonardus-1260-Regular.ttf fonts/Leonardus-1260-Regular.ttf
          python -m leonardus.cli audit --font build/Leonardus-1260-Regular.ttf
          python -m leonardus.cli charset --font build/Leonardus-1260-Regular.ttf
          for ppem in 16 24 48 96 128; do
            python examples/regular_spacing_check.py --font build/Leonardus-1260-Regular.ttf --ppem "$ppem" --out "build/pairs-1260-$ppem.json"
          done
          python examples/regular_specimen.py --font build/Leonardus-1260-Regular.ttf --out build/proof-1260 --candidate
          python examples/bfhioq_selection_proof.py --out build/bfhioq-selection.png
          python examples/jkuvwxyz_study.py --out build/jkuvwxyz-study
          for variant in A B; do
            python -m leonardus.cli audit --font "build/jkuvwxyz-study/Leonardus-JKUVWXYZ-$variant.ttf"
            python -m leonardus.cli charset --font "build/jkuvwxyz-study/Leonardus-JKUVWXYZ-$variant.ttf"
            for ppem in 16 24 48 96 128; do
              python examples/regular_spacing_check.py --font "build/jkuvwxyz-study/Leonardus-JKUVWXYZ-$variant.ttf" --ppem "$ppem" --out "build/jkuvwxyz-study/pairs-$variant-$ppem.json"
            done
          done
          python -m leonardus.cli build-release --version 1.270 --out build/Leonardus-1270-Regular.ttf
          cmp build/Leonardus-1270-Regular.ttf fonts/Leonardus-1270-Regular.ttf
          python -m leonardus.cli audit --font build/Leonardus-1270-Regular.ttf
          python -m leonardus.cli charset --font build/Leonardus-1270-Regular.ttf
          for ppem in 16 24 48 96 128; do
            python examples/regular_spacing_check.py --font build/Leonardus-1270-Regular.ttf --ppem "$ppem" --out "build/pairs-1270-$ppem.json"
          done
          python examples/regular_specimen.py --font build/Leonardus-1270-Regular.ttf --out build/proof-1270 --candidate
          python examples/jkuvwxyz_selection_proof.py --out build/jkuvwxyz-selection.png
          python examples/finalize_regular_1270.py --out build/Leonardus-Regular-1.270.ttf
          cmp build/Leonardus-Regular-1.270.ttf fonts/Leonardus-Regular-1.270.ttf
          python -m leonardus.cli audit --font build/Leonardus-Regular-1.270.ttf
          python -m leonardus.cli charset --font build/Leonardus-Regular-1.270.ttf
          python examples/regular_specimen.py --font build/Leonardus-Regular-1.270.ttf --out build/proof-named-1270 --candidate
          python examples/print_specimen_1270.py --out build/Leonardus-1270-Print-Specimen.pdf
          cmp build/Leonardus-1270-Print-Specimen.pdf specimen/Leonardus-1270-Print-Specimen.pdf
          python examples/build_specular_rtl.py --out build/Leonardus-Specchio-RTL-1.270.ttf
          cmp build/Leonardus-Specchio-RTL-1.270.ttf fonts/Leonardus-Specchio-RTL-1.270.ttf
          python -m leonardus.cli audit --font build/Leonardus-Specchio-RTL-1.270.ttf
          python -m leonardus.cli charset --font build/Leonardus-Specchio-RTL-1.270.ttf
          python examples/specular_preview.py --out build/Leonardus-Specchio-Preview.png
